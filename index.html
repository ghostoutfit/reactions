<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fission Digital Model</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Variables ─────────────────────────────────────────────────────────── */
  :root {
    --accent1:      #ff2d78;
    --accent1-dim:  rgba(255,45,120,0.22);
    --accent1-glow: rgba(255,45,120,0.55);
    --accent2:      #1a6eff;
    --accent2-dim:  rgba(26,110,255,0.18);
    --accent2-glow: rgba(26,110,255,0.45);
    --ui-bg:        rgba(8,6,24,0.42);
    --ui-border:    rgba(255,255,255,0.07);
    --text-dim:     rgba(220,215,255,0.55);
    --text-bright:  rgba(240,235,255,0.92);
  }

  /* ── Reset & base ──────────────────────────────────────────────────────── */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #05040f;
    color: var(--text-bright);
    font-family: 'Lexend', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  button, input, select {
    font-family: 'Lexend', sans-serif;
  }

  /* ── Full-viewport canvas ──────────────────────────────────────────────── */
  #canvas {
    position: fixed;
    top: 0; left: 0;
    display: block;
    z-index: 0;
  }

  /* ── Toolbar — floating glass overlay ─────────────────────────────────── */
  #toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 20px 10px;
    background: var(--ui-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.55);
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  /* ── Buttons ───────────────────────────────────────────────────────────── */
  .btn {
    padding: 4px 14px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: rgba(255,255,255,0.18);
    box-shadow: none;
    text-shadow: none;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn:hover {
    color: rgba(255,255,255,0.38);
    border-color: rgba(255,255,255,0.12);
  }

  /* Go idle (▶) — accent2 themed */
  #goBtn {
    border-color: var(--accent2);
    color: rgba(255,255,255,0.5);
    background: var(--accent2-dim);
    box-shadow:
      inset 0 0 6px var(--accent2-dim),
      0 0 2px var(--accent2),
      0 0 8px var(--accent2),
      0 0 18px var(--accent2-glow),
      0 0 40px var(--accent2-dim),
      0 0 70px var(--accent2-dim);
    text-shadow:
      0 0 4px rgba(255,255,255,0.5),
      0 0 10px var(--accent2),
      0 0 22px var(--accent2-glow),
      0 0 44px var(--accent2-dim);
    display: flex; align-items: center; justify-content: center;
  }
  #goBtn:hover { background: var(--accent2-glow); }
  /* Go running (❙ ❙) — red */
  #goBtn.running {
    border-color: #ff4040;
    color: rgba(255,255,255,0.5);
    background: rgba(255,40,40,0.15);
    box-shadow:
      inset 0 0 6px rgba(255,40,40,0.2),
      0 0 2px #ff4040,
      0 0 8px #ff4040,
      0 0 18px rgba(255,40,40,0.5),
      0 0 40px rgba(255,40,40,0.2);
    text-shadow: 0 0 4px rgba(255,255,255,0.5), 0 0 10px #ff4040, 0 0 22px rgba(255,80,80,0.6);
  }
  #goBtn.running:hover { background: rgba(255,40,40,0.3); }

  /* Clear — accent2 themed */
  #clearBtn {
    border-color: var(--accent2);
    color: rgba(255,255,255,0.5);
    background: var(--accent2-dim);
    box-shadow:
      inset 0 0 6px var(--accent2-dim),
      0 0 2px var(--accent2),
      0 0 8px var(--accent2),
      0 0 18px var(--accent2-glow),
      0 0 40px var(--accent2-dim);
    text-shadow:
      0 0 4px rgba(255,255,255,0.5),
      0 0 10px var(--accent2),
      0 0 22px var(--accent2-glow);
  }
  #clearBtn:hover { background: var(--accent2-glow); }

  /* Go / New — squished symbol buttons.
     #goBtn is sized for its widest label ("\u276e\u276e PAUSE"), not its current one, so
     toggling GO/PAUSE never resizes it or shifts Reset underneath. */
  #goBtn, #newBtn { padding: 8px 28px; font-size: 22px; letter-spacing: 2px; }
  #goBtn {
    font-size: 22px;
    letter-spacing: 0;
    padding: 7px 0;
    width: 132px;
    line-height: 1;
    white-space: nowrap;
    text-align: center;
  }

  /* ========================================
     BUTTON GROUPS — stacked option pickers
     ======================================== */
  .awheel-item {
    display: block;
    padding: 2px 12px;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 5px;
    background: transparent;
    color: rgba(255,255,255,0.15);
    font-size: 10px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    letter-spacing: 0.5px;
    transition: color 0.15s, border-color 0.15s, background 0.15s,
                box-shadow 0.15s, text-shadow 0.15s,
                opacity 0.18s ease, transform 0.22s ease;
  }
  .awheel-item:hover:not(.active) {
    color: var(--accent2);
    border-color: var(--accent2);
    background: var(--accent2-dim);
    box-shadow:
      0 0 4px var(--accent2),
      0 0 12px var(--accent2-glow),
      0 0 26px var(--accent2-dim);
    text-shadow:
      0 0 6px var(--accent2),
      0 0 14px var(--accent2-glow);
  }
  .awheel-item.active {
    color: var(--accent2);
    border-color: var(--accent2);
    background: var(--accent2-dim);
    box-shadow:
      0 0 3px var(--accent2),
      0 0 9px var(--accent2-glow),
      0 0 20px var(--accent2-dim);
    text-shadow:
      0 0 5px var(--accent2),
      0 0 12px var(--accent2-glow);
  }

  /* New — neon pink, matches Go */
  #newBtn {
    border-color: var(--accent1);
    color: rgba(255,255,255,0.5);
    background: var(--accent1-dim);
    box-shadow:
      inset 0 0 6px var(--accent1-dim),
      0 0 2px var(--accent1),
      0 0 8px var(--accent1),
      0 0 18px var(--accent1-glow),
      0 0 40px var(--accent1-dim),
      0 0 70px var(--accent1-dim);
    text-shadow:
      0 0 4px rgba(255,255,255,0.5),
      0 0 10px var(--accent1),
      0 0 22px var(--accent1-glow),
      0 0 44px var(--accent1-dim);
  }
  #newBtn:hover {
    background: var(--accent1-glow);
    box-shadow:
      inset 0 0 10px var(--accent1-glow),
      0 0 4px var(--accent1),
      0 0 14px var(--accent1),
      0 0 28px var(--accent1-glow),
      0 0 60px var(--accent1-dim),
      0 0 100px var(--accent1-dim);
  }

  /* ── Sliders ───────────────────────────────────────────────────────────── */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 3px;
    background: rgba(255,255,255,0.10);
    box-shadow:
      0 0 4px var(--accent2),
      0 0 12px var(--accent2-glow),
      0 0 28px var(--accent2-dim);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 24px;
    border-radius: 3px;
    background: var(--accent2);
    border: none;
    box-shadow:
      0 0 3px var(--accent2),
      0 0 10px var(--accent2-glow),
      0 0 24px var(--accent2-dim),
      0 0 44px var(--accent2-dim);
    cursor: grab;
    transition: box-shadow 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:active {
    cursor: grabbing;
    box-shadow:
      0 0 4px var(--accent2),
      0 0 18px var(--accent2-glow),
      0 0 40px var(--accent2-dim),
      0 0 70px var(--accent2-dim);
  }
  input[type="range"]::-moz-range-thumb {
    width: 10px; height: 24px;
    border-radius: 3px;
    background: var(--accent2);
    border: none;
    box-shadow: 0 0 3px var(--accent2), 0 0 10px var(--accent2-glow);
    cursor: grab;
  }

  .slider-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── Neutron speed bounce warning ────────────────────────────────────── */
  #neutronSpeedWrap { position: relative; display: flex; align-items: center; }
  #neutronSpeedWrap.bounce-warn::before {
    content: '←';
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    font-weight: 700;
    color: #ff2626;
    text-shadow:
      0 0 6px #ff2626,
      0 0 16px rgba(255,38,38,0.9),
      0 0 32px rgba(255,38,38,0.6);
    pointer-events: none;
    animation: neutronWarnPulse 0.75s ease-in-out infinite;
    white-space: nowrap;
    line-height: 1;
  }
  #neutronSpeedWrap.bounce-warn::after {
    content: '';
    position: absolute;
    inset: -10px;
    background: rgba(255, 38, 38, 0.72);
    border-radius: 10px;
    filter: blur(18px);
    z-index: -1;
    pointer-events: none;
    animation: neutronWarnPulse 0.75s ease-in-out infinite;
  }
  @keyframes neutronWarnPulse {
    0%, 100% { opacity: 0.3; }
    50%       { opacity: 1.0; }
  }

  /* ── Control boxes ─────────────────────────────────────────────────────── */
  .ctrl-box-pink {
    display: flex;
    align-items: center;
    align-self: stretch;
    gap: 14px;
    background: rgba(255,45,120,0.07);
    border: 1px solid rgba(255,45,120,0.22);
    border-radius: 12px;
    padding: 10px 16px;
    position: relative;
  }
  .ctrl-box-pink input[type="range"] { width: 120px; }
  .ctrl-box-label {
    position: absolute;
    bottom: 100%;
    margin-bottom: 3px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1;
    pointer-events: none;
  }
  .ctrl-box-label-pink {
    right: 14px;
    color: rgba(255,45,120,0.8);
    text-shadow: 0 0 6px rgba(255,45,120,0.6), 0 0 16px rgba(255,45,120,0.3);
  }
  .ctrl-box-label-blue {
    left: 14px;
    color: var(--accent2);
    opacity: 0.8;
    text-shadow: 0 0 6px var(--accent2-glow), 0 0 16px var(--accent2-dim);
  }

  /* ── NEW button wrapper (the molecule choice dropdown was removed) ────────── */
  .pwheel { position: relative; display: flex; flex-direction: column; align-self: stretch; }
  .pwheel.locked { opacity: 0.35; pointer-events: none; }

  .ctrl-box-blue {
    display: flex;
    align-items: center;
    align-self: stretch;
    gap: 18px;
    background: var(--accent2-dim);
    border: 1px solid var(--accent2);
    border-radius: 12px;
    padding: 10px 16px;
    position: relative;
  }
  .ctrl-box-blue input[type="range"] { width: 150px; }
  .ctrl-box-blue .slider-icon { font-size: 28px; }
  .ctrl-box-blue .toggle-label { font-size: 13px; gap: 6px; }
  .ctrl-box-blue .field-label-electric { font-size: 13px; }
  .ctrl-box-blue .awheel-item { font-size: 14px; padding: 5px 14px; }
  .slider-group label {
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    letter-spacing: 0.5px;
  }
  .slider-group label span {
    display: inline-block;
    min-width: 3em;
    text-align: right;
    color: var(--accent2);
    text-shadow: 0 0 5px var(--accent2-glow);
  }
  .slider-group input[type="range"] { width: 80px; }

  .slider-icon {
    font-size: 18px;
    line-height: 1;
    user-select: none;
    filter:
      brightness(0) invert(1)
      blur(0.5px)
      opacity(0.65)
      drop-shadow(0 0 4px var(--accent2))
      drop-shadow(0 0 12px var(--accent2))
      drop-shadow(0 0 24px var(--accent2-glow));
  }

  /* ── Toggle labels ─────────────────────────────────────────────────────── */
  .toggle-label {
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  .toggle-label input[type="checkbox"] { accent-color: var(--accent1); }

  .field-label-electric {
    color: #46a5ff;
    text-shadow:
      0 0 4px #46a5ff,
      0 0 10px rgba(70,165,255,0.5),
      0 0 22px rgba(70,165,255,0.2);
  }

  /* ── Scrub bar — floating glass at bottom ──────────────────────────────── */
  #scrubBar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    display: none;
    flex-direction: row;
    background: var(--ui-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--ui-border);
    box-shadow: 0 -1px 0 var(--accent1-dim), 0 -4px 20px rgba(0,0,0,0.5);
  }
  #scrubBar.visible { display: flex; }
  /* Left panel: key labels + replay/clock controls */
  #scrubLeftPanel {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    flex-shrink: 0;
    width: 112px;
    border-right: 1px solid var(--ui-border);
  }
  #scrubGraphKey {
    display: none;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    justify-content: center;
    padding: 0 8px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: 0.02em;
  }
  #scrubGraphKey.visible { display: flex; }
  #scrubControls {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 80px;
    padding: 0 8px;
    flex-shrink: 0;
  }
  /* Right panel: energyMain (graph+slider) + scrubRowRight (pct+toggle) */
  #scrubRightPanel {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: row;
  }
  #energyMain {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    padding: 6px 0;
  }
  #scrubButtons {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 80px;
    padding: 0 12px;
    flex-shrink: 0;
    margin-top: auto;
  }
  #energyGraphBox {
    display: none;
    flex-direction: column;
    border-bottom: 1px solid rgba(26,110,255,0.25);
    background: rgba(26,110,255,0.04);
  }
  #energyGraphBox.visible { display: flex; }
  #scrubPercents {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 12px;
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
  }
  #scrubPercents.visible { display: flex; }
  #energyPctNums {
    display: flex;
    gap: 10px;
  }
  #energyPctNote {
    font-size: 12px;
    color: #ff3a6e;
    text-align: center;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }
  #energyGraphToggle {
    border: 1px solid var(--accent2);
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    background: var(--accent2-dim);
    color: rgba(255,255,255,0.5);
    font-family: inherit;
    flex: 1;
    line-height: 1.25;
    padding: 6px 10px;
    text-align: center;
    white-space: normal;
    box-shadow:
      inset 0 0 6px var(--accent2-dim),
      0 0 2px var(--accent2), 0 0 8px var(--accent2),
      0 0 18px var(--accent2-glow), 0 0 40px var(--accent2-dim);
    text-shadow: 0 0 4px rgba(255,255,255,0.5), 0 0 10px var(--accent2);
    transition: all 0.2s;
  }
  #energyGraphToggle:hover { background: var(--accent2-glow); }
  #energyGraphToggle.active {
    box-shadow:
      inset 0 0 8px var(--accent2-dim),
      0 0 4px var(--accent2), 0 0 14px var(--accent2),
      0 0 28px var(--accent2-glow), 0 0 55px var(--accent2-dim);
  }
  #energyGraph {
    display: block;
    width: 100%;
    height: 110px;
    cursor: crosshair;
  }
  #scrubBar .scrub-label {
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  #scrubPct { display: none; }

  .theme-btn {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
    box-shadow: none;
  }
  .theme-btn:hover { transform: scale(1.2); box-shadow: 0 0 8px rgba(255,255,255,0.3); }
  .theme-btn.active {
    border-color: rgba(255,255,255,0.55);
    box-shadow: 0 0 6px rgba(255,255,255,0.4), 0 0 14px rgba(255,255,255,0.15);
  }
  #themeA { background: #1a6eff; }
  #themeB { background: #bd00ff; }
  #themeC { background: #00f5e0; }
  #themeLight { background: #fff; }
  #bgColorPicker { display:none; width:22px; height:22px; padding:2px; border-radius:4px; border:1px solid rgba(0,0,0,0.25); cursor:pointer; vertical-align:middle; margin-left:4px; }
  body.screenshot-mode #bgColorPicker { display:inline-block; }
  body.screenshot-mode #themeLight { display: none; }
  body.screenshot-mode { background: var(--bg-color, #fff) !important; }
  body.screenshot-mode #toolbar { background: rgba(255,255,255,0.42) !important; box-shadow: none !important; }
  body.screenshot-mode #toolbar,
  body.screenshot-mode #toolbar * {
    color: #000 !important;
    text-shadow: none !important;
  }
  body.screenshot-mode #toolbar button {
    border-color: #000 !important;
    box-shadow: none !important;
  }
  body.screenshot-mode input[type="range"] {
    box-shadow: none !important;
    background: rgba(0,0,0,0.15) !important;
  }
  body.screenshot-mode input[type="range"]::-webkit-slider-thumb {
    background: #000 !important;
    box-shadow: none !important;
  }
  body.screenshot-mode input[type="range"]::-moz-range-thumb {
    background: #000 !important;
    box-shadow: none !important;
  }
  body.screenshot-mode .slider-icon {
    filter: brightness(0) !important;
    opacity: 1 !important;
  }
  body.screenshot-mode #bugReportBtn .slider-icon {
    filter: drop-shadow(0 0 5px rgba(200,0,0,0.8)) drop-shadow(0 0 14px rgba(180,0,0,0.5)) !important;
    background: rgba(210,210,210,0.85) !important;
  }
  body.screenshot-mode #qualitySelect {
    background: rgba(220,220,220,0.5) !important;
    color: rgba(0,0,0,0.35) !important;
    border-color: rgba(0,0,0,0.12) !important;
  }
  body.screenshot-mode #scrubBar {
    background: rgba(255,255,255,0.42) !important;
    border-top-color: rgba(0,0,0,0.15) !important;
    box-shadow: none !important;
  }
  body.screenshot-mode #scrubBar,
  body.screenshot-mode #scrubBar * { color: #000 !important; text-shadow: none !important; }
  body.screenshot-mode #scrubBar button { border-color: #000 !important; box-shadow: none !important; }
  body.screenshot-mode #energyGraph { background: #fff !important; }
  /* Preserve educational color codes: electric = blue, strong = orange */
  body.screenshot-mode .field-label-electric { color: #46a5ff !important; }
  body.screenshot-mode .field-label-strong   { color: #ffb946 !important; }
  body.screenshot-mode img[alt="logo"] { display: none !important; }

  /* ── Quality select ──────────────────────────────────────────────────────── */
  #qualitySelect {
    background: rgba(10,8,20,0.5); color: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.04); border-radius: 4px;
    padding: 2px 4px; font-size: 12px; font-family: inherit; cursor: pointer;
  }
  #qualitySelect:focus { outline: 1px solid rgba(255,100,100,0.4); }
  #qualitySelect:hover { color: rgba(255,255,255,0.55); border-color: rgba(255,255,255,0.18); }

</style>
</head>
<body>

<canvas id="canvas"></canvas>


<div id="toolbar">
  <div class="toolbar-row">
    <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
      <select id="qualitySelect">
        <option value="hi-res">Hi-res</option>
        <option value="detailed">Detailed</option>
        <option value="simple">Simple</option>
      </select>
      <button class="theme-btn active" id="themeA" title="Synthwave"></button>
      <button class="theme-btn" id="themeB" title="Industrial"></button>
      <button class="theme-btn" id="themeC" title="Neon Blue"></button>
      <button class="theme-btn" id="themeLight" title="Light mode"></button>

<div id="bugModal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(2,1,12,0.85);backdrop-filter:blur(6px);align-items:center;justify-content:center;">

    <iframe id="bugModalFrame" src="about:blank" style="flex:1;border:none;border-radius:14px;background:#05040f;"></iframe>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
// PARTICLE_RADIUS is the drawn radius of one ATOM (was one proton/neutron at 10px).
// Nearly all the scene geometry — masks, outline scallops, projectile offsets — is
// expressed as a multiple of it, so bumping it here scales the whole scene.
const PARTICLE_RADIUS = 30;
const coulombStrength = 150;

// ─── Elements ─────────────────────────────────────────────────────────────────
// rScale ≈ van der Waals radius relative to hydrogen (H 1.20 Å, O 1.52 Å).
// q is the partial charge an atom carries, in units of e. Both are 0 here: an
// H2 molecule is non-polar, so "Show electric field" has nothing to draw. Give
// O a negative q and H a positive one to light the field up for polar bonds.
const ELEMENTS = {
  H: { label: 'H', rgb: '185,192,205', rScale: 1.00, q: 0 },   // grey
  O: { label: 'O', rgb: '232,56,47',   rScale: 1.27, q: 0 },   // red
};
const DEFAULT_ELEMENT = 'H';
function elemOf(p) { return ELEMENTS[p.el] || ELEMENTS[DEFAULT_ELEMENT]; }
const rgba = (rgb, a) => `rgba(${rgb},${a})`;

// Centre-to-centre bond length, as a fraction of the two atoms' radii summed:
// < 1 so bonded atoms visibly overlap the way a space-filling model does.
const BOND_OVERLAP = 0.72;
function bondLen(elA, elB) {
  return (ELEMENTS[elA].rScale + ELEMENTS[elB].rScale) * PARTICLE_RADIUS * BOND_OVERLAP;
}

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const egCanvas = document.getElementById('energyGraph');
const egCtx    = egCanvas.getContext('2d');

// ─── Heatmap buffers ──────────────────────────────────────────────────────────
const hmCanvas    = document.createElement('canvas');
const hmCtx       = hmCanvas.getContext('2d');
const hmComposite = document.createElement('canvas');
const hmcCtx      = hmComposite.getContext('2d');
const hmSnap      = document.createElement('canvas');  // pre-transition snapshot for crossfade
const hmSnapCtx   = hmSnap.getContext('2d');

let hmW = 0, hmH = 0;
let hmDataElec = null;
let hmImgElec  = null;
let heatmapDirty    = true;
let hmFrameCounter  = 0;
let _hmXfadeStartFrac = -1;   // frac at which phase-3 crossfade began; -1 = inactive
const HM_XFADE_DURATION = 0.04;  // crossfade window in frac units (~200ms at normal speed)

// ── Quality selector ──────────────────────────────────────────────────────────
let _quality = 'hi-res';  // 'hi-res' | 'detailed' | 'simple'

// ── Dev perf toggles (driven by _applyQuality) ────────────────────────────────
let _flatFill = true;

function _applyQuality(level) {
  _quality = level;
  const el = document.getElementById('qualitySelect');
  if (el) el.value = level;
  _flatFill = true;
}

// Draws 100 gradient+shadowBlur particles to an offscreen canvas and returns ms.
// getImageData() at the end forces a GPU sync so the time is real.
// A 15-particle warm-up pass runs first to settle JIT and GPU init cost.
function _runPerfBenchmark() {
  const oc = document.createElement('canvas');
  oc.width = 300; oc.height = 300;
  const dc = oc.getContext('2d');
  const R = PARTICLE_RADIUS;
  for (let i = 0; i < 15; i++) {
    const x = 15 + (i % 5) * 40, y = 15 + Math.floor(i / 5) * 40;
    const g = dc.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, '#ff1a65'); g.addColorStop(1, 'rgba(0,0,0,0)');
    dc.fillStyle = g; dc.beginPath(); dc.arc(x, y, R, 0, Math.PI * 2); dc.fill();
  }
  const t0 = performance.now();
  for (let i = 0; i < 100; i++) {
    const x = 15 + (i % 10) * 27, y = 15 + Math.floor(i / 10) * 27;
    const g1 = dc.createRadialGradient(x, y, 0, x, y, R * 1.1);
    g1.addColorStop(0, '#ff1a65'); g1.addColorStop(0.82, '#ff1a65'); g1.addColorStop(1, 'rgba(0,0,0,0)');
    dc.fillStyle = g1; dc.beginPath(); dc.arc(x, y, R * 1.1, 0, Math.PI * 2); dc.fill();
    const g2 = dc.createRadialGradient(x, y, 0, x, y, R);
    g2.addColorStop(0, '#ff80b0'); g2.addColorStop(0.5, '#ff80b0'); g2.addColorStop(1, 'rgba(0,0,0,0)');
    dc.save(); dc.shadowColor = '#ff80b0'; dc.shadowBlur = 8; dc.globalAlpha = 0.82;
    dc.fillStyle = g2; dc.beginPath(); dc.arc(x, y, R, 0, Math.PI * 2); dc.fill();
    dc.restore(); dc.globalAlpha = 1;
  }
  dc.getImageData(0, 0, 1, 1); // force GPU flush so timing is real
  return performance.now() - t0;
}

function resize() {
  canvas.width   = window.innerWidth;
  canvas.height  = window.innerHeight;
  egCanvas.width  = Math.max(1, egCanvas.offsetWidth || (window.innerWidth - 112));
  egCanvas.height = 110;
  heatmapDirty   = true;
}
resize();
window.addEventListener('resize', () => {
  resize();
  document.getElementById('scrubBar').classList.add('visible');
  heatmapDirty = true;
  // Stretch the wrap box to the new band, carrying the molecules with it so a
  // window resize does not dump everything outside the world or on top of itself.
  const { oldW, oldH } = syncWorldBox();
  if (oldW > 0 && oldH > 0) {
    for (const b of world.bodies) { b.x *= world.w / oldW; b.y *= world.h / oldH; }
  }
});

function ensureHmBuffers(w, h) {
  if (hmW === w && hmH === h) return;
  hmW = w; hmH = h;
  hmCanvas.width    = w; hmCanvas.height = h;
  hmDataElec = new Uint8ClampedArray(w * h * 4);
  hmImgElec  = new ImageData(hmDataElec, w, h);
}

// ─── Colormaps ────────────────────────────────────────────────────────────────
function buildColorstops(stops, out) {
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let s0 = stops[0], s1 = stops[1];
    for (let s = 0; s < stops.length - 1; s++) {
      if (t >= stops[s].t && t <= stops[s+1].t) { s0 = stops[s]; s1 = stops[s+1]; break; }
    }
    const f   = (s1.t === s0.t) ? 0 : (t - s0.t) / (s1.t - s0.t);
    const idx = i * 4;
    out[idx]   = s0.r + (s1.r - s0.r) * f;
    out[idx+1] = s0.g + (s1.g - s0.g) * f;
    out[idx+2] = s0.b + (s1.b - s0.b) * f;
    out[idx+3] = s0.a + (s1.a - s0.a) * f;
  }
}

const COLORMAP = new Uint8Array(256 * 4);
buildColorstops([
  { t: 0.0,  r: 0,   g: 0,   b: 0,   a: 0   },
  { t: 0.12, r: 10,  g: 35,  b: 170, a: 140 },
  { t: 0.4,  r: 25,  g: 85,  b: 235, a: 210 },
  { t: 0.7,  r: 70,  g: 165, b: 255, a: 245 },
  { t: 1.0,  r: 210, g: 238, b: 255, a: 255 },
], COLORMAP);

// ─── Molecule generation ──────────────────────────────────────────────────────
// A molecule is a list of atoms laid out in a row along `angle`, centred on
// (cx, cy). Same shape as the old nucleus object — {particles, sphereR, cx, cy} —
// so every consumer downstream (masks, outlines, pre-render, force panel) is
// unchanged. `els` is e.g. ['H','H'] for H2 or ['H','O','H'] for water.
function makeMolecule(els, cx, cy, angle = 0, tag = null) {
  // Cumulative offsets along the chain, then re-centred on the midpoint
  const offs = [0];
  for (let k = 1; k < els.length; k++) {
    offs.push(offs[k - 1] + bondLen(els[k - 1], els[k]));
  }
  const mid = (offs[0] + offs[offs.length - 1]) / 2;

  const ca = Math.cos(angle), sa = Math.sin(angle);
  const particles = els.map((el, k) => {
    const d = offs[k] - mid;
    return { x: cx + d * ca, y: cy + d * sa, z: 0, el, type: 'atom', i: k, tag };
  });

  // Enclosing radius: furthest atom centre plus its own drawn radius
  const sphereR = Math.max(...els.map((el, k) =>
    Math.abs(offs[k] - mid) + PARTICLE_RADIUS * ELEMENTS[el].rScale));

  return { particles, sphereR, cx, cy };
}

// Half the length of a molecule laid out along its own axis — how far its
// centre sits from its leading edge.
function moleculeHalfLen(els) {
  let total = 0;
  for (let k = 1; k < els.length; k++) total += bondLen(els[k - 1], els[k]);
  return total / 2 + PARTICLE_RADIUS * Math.max(...els.map(e => ELEMENTS[e].rScale));
}

// ─── Electric field heatmap ───────────────────────────────────────────────────
// masks: [{cx, cy, r}] — soft radial clipping; alpha fades to 0 at r + PARTICLE_RADIUS*2
function drawElectricHeatmap(particleList, sampleFrac = 0.5, sigmaScale = 1.0, masks = null, boundsExpand = 50, destCtx = ctx, _forceRender = false) {
  const fullW = canvas.width, fullH = canvas.height;

  const _hmSizeMatch = hmComposite.width === fullW && hmComposite.height === fullH;
  if (!_forceRender && !heatmapDirty && _hmSizeMatch) {
    destCtx.drawImage(hmComposite, 0, 0);
    return;
  }
  const scale    = _quality === 'simple' ? 0.08 : _quality === 'detailed' ? 0.15 : 0.25;
  const w        = Math.ceil(fullW * scale);
  const h        = Math.ceil(fullH * scale);
  const invScale = 1 / scale;

  let protons = particleList.filter(p =>
    elemOf(p).q !== 0 &&
    p.x > -boundsExpand && p.x < fullW + boundsExpand &&
    p.y > -boundsExpand && p.y < fullH + boundsExpand
  );
  if (sampleFrac < 1.0) {
    protons = protons.filter((_, i) => i % Math.round(1 / sampleFrac) === 0);
  }

  const refEnergy = coulombStrength / (PARTICLE_RADIUS * 2);
  const logRef    = Math.log(2);
  const elecPairs = [];
  for (let i = 0; i < protons.length; i++) {
    for (let j = i+1; j < protons.length; j++) {
      const a = protons[i], b = protons[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 0.01) continue;
      const energy   = coulombStrength / dist;
      const sigma    = Math.max(3.5, 28 / Math.sqrt(dist)) * sigmaScale;
      const distFade = Math.exp(-dist / 350);
      const mag      = Math.min(1, Math.log(1 + energy / refEnergy) / logRef) * distFade;
      const cullSq   = 16 * (sigma*2) * (sigma*2);
      elecPairs.push({ ax: a.x, ay: a.y, ux: dx/dist, uy: dy/dist, dist, sigma, mag, cullSq });
    }
  }
  elecPairs.sort((a, b) => b.mag - a.mag);
  if (elecPairs.length === 0) return;

  ensureHmBuffers(w, h);
  hmDataElec.fill(0);

  // Clamp pixel loop to the bounding box of active protons — skips the large
  // empty canvas area around the nucleus, which is typically 90%+ of pixels.
  let bxMin = w, bxMax = 0, byMin = h, byMax = 0;
  for (const p of protons) {
    const sx = (p.x * scale) | 0, sy = (p.y * scale) | 0;
    if (sx < bxMin) bxMin = sx; if (sx > bxMax) bxMax = sx;
    if (sy < byMin) byMin = sy; if (sy > byMax) byMax = sy;
  }
  const bMarg = Math.ceil(50 * scale);  // max pair influence radius in world px
  bxMin = Math.max(0, bxMin - bMarg);  bxMax = Math.min(w - 1, bxMax + bMarg);
  byMin = Math.max(0, byMin - bMarg);  byMax = Math.min(h - 1, byMax + bMarg);

  for (let py = byMin; py <= byMax; py++) {
    const worldY = py * invScale;
    for (let px = bxMin; px <= bxMax; px++) {
      const worldX = px * invScale;
      let total = 0;
      for (let k = 0; k < elecPairs.length; k++) {
        const p    = elecPairs[k];
        const rx   = worldX - p.ax, ry = worldY - p.ay;
        const para = rx*p.ux + ry*p.uy;
        const e1   = para > 0 ? Math.min(1, para/8) : 0;
        const e2   = para < p.dist ? Math.min(1, (p.dist-para)/8) : 0;
        const ef   = e1 * e2;
        if (ef <= 0) continue;
        const perpSq = Math.max(0, rx*rx + ry*ry - para*para);
        if (perpSq > p.cullSq) continue;
        const t      = para / p.dist;
        const sigmaT = p.sigma * (1 + Math.sin(Math.PI * t));
        total += p.mag * Math.exp(-perpSq / (2*sigmaT*sigmaT)) * ef;
        if (total >= 1/3) break;
      }
      if (total > 0.002) {
        // Soft radial mask — clamp heatmap to nucleus boundary.
        // Supports two mask types:
        //   circle  { cx, cy, r, bleed }
        //   capsule { type:'capsule', cx1,cy1,r1, cx2,cy2,r2, bleed }
        //     — tapered hull between two spheres; fills the gap with no dark seam.
        let maskAlpha = 1;
        if (masks) {
          maskAlpha = 0;
          const defaultBleed = PARTICLE_RADIUS * 2;
          for (const m of masks) {
            if (maskAlpha >= 1) break;
            const bleed = m.bleed !== undefined ? m.bleed : defaultBleed;
            if (m.type === 'capsule') {
              // Project pixel onto the segment cx1→cx2, interpolate radius
              const sdx = m.cx2 - m.cx1, sdy = m.cy2 - m.cy1;
              const lenSq = sdx*sdx + sdy*sdy;
              const st = lenSq > 0
                ? Math.max(0, Math.min(1, ((worldX-m.cx1)*sdx + (worldY-m.cy1)*sdy) / lenSq))
                : 0;
              const projX = m.cx1 + st*sdx, projY = m.cy1 + st*sdy;
              const perpDist = Math.sqrt((worldX-projX)**2 + (worldY-projY)**2);
              const capsR = m.r1 + (m.r2 - m.r1) * st;
              if (perpDist <= capsR) { maskAlpha = 1; break; }
              const mt = (perpDist - capsR) / bleed;
              maskAlpha = Math.max(maskAlpha, mt < 1 ? 1 - mt : 0);
            } else {
              const mdx = worldX - m.cx, mdy = worldY - m.cy;
              const mdist = Math.sqrt(mdx*mdx + mdy*mdy);
              if (mdist <= m.r) { maskAlpha = 1; break; }
              const mt = (mdist - m.r) / bleed;
              maskAlpha = Math.max(maskAlpha, mt < 1 ? 1 - mt : 0);
            }
          }
        }
        if (maskAlpha > 0) {
          const ci = Math.min(255, (total * 3.0 * 255)|0);
          const c4 = ci * 4;
          const di = (py * w + px) * 4;
          hmDataElec[di]   = COLORMAP[c4];   hmDataElec[di+1] = COLORMAP[c4+1];
          hmDataElec[di+2] = COLORMAP[c4+2];
          hmDataElec[di+3] = (COLORMAP[c4+3] * maskAlpha + 0.5) | 0;
        }
      }
    }
  }

  if (hmComposite.width !== fullW || hmComposite.height !== fullH) {
    hmComposite.width = fullW; hmComposite.height = fullH;
  }
  hmcCtx.clearRect(0, 0, fullW, fullH);
  hmcCtx.imageSmoothingEnabled = true;
  hmcCtx.imageSmoothingQuality = 'low';
  hmCtx.putImageData(hmImgElec, 0, 0);
  hmcCtx.drawImage(hmCanvas, 0, 0, fullW, fullH);
  destCtx.drawImage(hmComposite, 0, 0);
  if (destCtx === ctx) {
    heatmapDirty = false;
  }
}

// ─── Molecule outline — union silhouette of the atom circles ────────────────
// Outline mode draws the space-filling shape of the molecule: each atom's circle
// is stroked only where it is not buried inside another atom, so overlapping
// atoms read as one outline rather than a pile of rings.
function drawMoleculeOutline(atoms, c = ctx) {
  if (!atoms || !atoms.length) return;
  const circles = atoms.map(p => ({
    x: p.x, y: p.y, r: PARTICLE_RADIUS * elemOf(p).rScale,
  }));

  const LIGHT = document.body.classList.contains('screenshot-mode');
  c.save();
  c.shadowColor = LIGHT ? 'rgba(0,0,0,0)' : 'rgba(80,160,255,0.9)';
  c.shadowBlur  = LIGHT ? 0 : 22;
  c.strokeStyle = LIGHT ? '#333' : 'rgba(160,215,255,1)';
  c.lineWidth   = LIGHT ? 2.5 : 4;

  const STEPS = 180;
  for (const a of circles) {
    let runStart = null;
    for (let k = 0; k <= STEPS; k++) {
      const th = k / STEPS * Math.PI * 2;
      const px = a.x + a.r * Math.cos(th), py = a.y + a.r * Math.sin(th);
      // The closing sample is always treated as "inside" so the last run flushes
      const buried = k === STEPS || circles.some(b =>
        b !== a && Math.hypot(px - b.x, py - b.y) < b.r);
      if (!buried && runStart === null) {
        runStart = th;
      } else if (buried && runStart !== null) {
        c.beginPath(); c.arc(a.x, a.y, a.r, runStart, th); c.stroke();
        runStart = null;
      }
    }
  }
  c.restore();
}

// ─── Atom renderer — semitransparent hollow sphere ───────────────────────────
// A shell, not a ball: clear through the middle so atoms behind show through,
// with the colour gathering towards the rim the way a thin spherical surface
// looks when you see through both its near and far faces. The rim stroke gives
// the hard silhouette; the specular arc is what makes it read as a sphere
// rather than a flat ring.
function drawAtom(dc, px, py, p, radiusScale = 1, alphaScale = 1) {
  const e = elemOf(p);
  const R = PARTICLE_RADIUS * e.rScale * radiusScale;
  const a = (v) => Math.min(1, v * alphaScale);

  if (_quality === 'simple') {
    // Cheap: flat wash + rim, no gradients
    dc.fillStyle   = rgba(e.rgb, a(0.16));
    dc.beginPath(); dc.arc(px, py, R, 0, Math.PI * 2); dc.fill();
    dc.strokeStyle = rgba(e.rgb, a(0.85));
    dc.lineWidth   = Math.max(1, R * 0.07);
    dc.stroke();
    return;
  }

  // Shell body — almost clear at the centre, densest just inside the rim
  const shell = dc.createRadialGradient(px, py, 0, px, py, R);
  shell.addColorStop(0.00, rgba(e.rgb, a(0.05)));
  shell.addColorStop(0.55, rgba(e.rgb, a(0.09)));
  shell.addColorStop(0.82, rgba(e.rgb, a(0.22)));
  shell.addColorStop(0.96, rgba(e.rgb, a(0.46)));
  shell.addColorStop(1.00, rgba(e.rgb, a(0.30)));
  dc.fillStyle = shell;
  dc.beginPath(); dc.arc(px, py, R, 0, Math.PI * 2); dc.fill();

  // Rim — the silhouette
  dc.save();
  if (_quality === 'hi-res') { dc.shadowColor = rgba(e.rgb, a(0.55)); dc.shadowBlur = R * 0.45; }
  dc.strokeStyle = rgba(e.rgb, a(0.92));
  dc.lineWidth   = Math.max(1.2, R * 0.075);
  dc.beginPath(); dc.arc(px, py, R * 0.985, 0, Math.PI * 2); dc.stroke();
  dc.restore();

  // Specular highlight — upper-left, reads as a lit curved surface
  if (_quality === 'hi-res') {
    dc.save();
    dc.strokeStyle = `rgba(255,255,255,${a(0.30)})`;
    dc.lineWidth   = Math.max(1, R * 0.055);
    dc.beginPath();
    dc.arc(px, py, R * 0.80, Math.PI * 1.08, Math.PI * 1.52);
    dc.stroke();
    dc.restore();
  }
}

function drawParticles(particles, radiusScale = 1, drawCtx = ctx) {
  const dc = drawCtx;
  // z ascending = back to front, so the translucent shells layer correctly
  const sorted = [...particles].sort((a, b) => (a.z || 0) - (b.z || 0));
  for (const p of sorted) drawAtom(dc, p.x, p.y, p, radiusScale);
}

// ─── Species ──────────────────────────────────────────────────────────────────
// What kinds of molecule the world is populated with. Give a species a weight > 0
// and spawnWorld will mix it in; H2 alone for now.
const SPECIES = [
  { els: ['H', 'H'], weight: 1 },
];

// ── Action log (for bug reports) ─────────────────────────────────────────────
const actionLog = [];
function logAction(msg) {
  actionLog.push(msg);
  if (actionLog.length > 25) actionLog.shift();
}

// Piecewise zoom mapping: slider -1..0..1, default at centre (v=0)
// v=-1 → 0.83 (20% wider),  v=0 → 1.0,  v=1 → 2.0
function zoomFromSlider(v) {
  return v <= 0 ? 1.0 + v * 0.17 : 1.0 + v * 1.0;
}

// ─── World ────────────────────────────────────────────────────────────────────
// A wrap-around ("asteroids") box the size of the canvas. Molecules are rigid
// bodies: they translate, spin, and bounce elastically off one another. There
// are no walls — anything leaving one edge comes back on the opposite one, and
// a body straddling an edge is drawn on both sides.
let viewZoom = 1.0;
let showParticles = true;
let running = false;

const MOL_COUNT_DEFAULT = 2;
let molCount = MOL_COUNT_DEFAULT;

// Atomic masses, in units where H = 1. Used for collision impulses and for the
// kinetic-energy readout, so a bounce off an O2 behaves like a bounce off
// something 16× heavier per atom.
const ATOMIC_MASS = { H: 1, O: 16 };

const world = {
  w: 0, h: 0,          // wrap dimensions
  top: 0,              // canvas y of the world's top edge
  bodies: [],
  time: 0,             // seconds of simulated time since the last respawn
};

// The world fills the band of canvas between the toolbar and the energy bar, so
// nothing can drift behind an opaque panel and look like it vanished.
function syncWorldBox() {
  const tbH  = document.getElementById('toolbar').offsetHeight;
  const sbEl = document.getElementById('scrubBar');
  const sbH  = sbEl.classList.contains('visible') ? sbEl.offsetHeight : 0;
  const oldW = world.w, oldH = world.h;
  world.top = tbH;
  world.w   = canvas.width;
  world.h   = Math.max(120, canvas.height - tbH - sbH);
  return { oldW, oldH };
}

// Build a rigid body from a list of element symbols. Atom positions are stored
// once in body-local coordinates; world positions are derived each frame from
// (x, y, angle), so the molecule can never stretch or come apart.
function makeBody(els, x, y, heading, speed, spin) {
  const offs = [0];
  for (let k = 1; k < els.length; k++) offs.push(offs[k - 1] + bondLen(els[k - 1], els[k]));
  const mid = (offs[0] + offs[offs.length - 1]) / 2;

  const atoms = els.map((el, k) => ({
    el,
    lx: offs[k] - mid,            // body-local, along the molecule axis
    ly: 0,
    r: PARTICLE_RADIUS * ELEMENTS[el].rScale,
    m: ATOMIC_MASS[el] || 1,
  }));

  const mass = atoms.reduce((a, at) => a + at.m, 0);
  // Moment of inertia about the centre of mass, treating atoms as point masses
  const inertia = atoms.reduce((a, at) => a + at.m * (at.lx * at.lx + at.ly * at.ly), 0) || 1;

  return {
    els, atoms, mass, inertia,
    x, y,
    vx: Math.cos(heading) * speed,
    vy: Math.sin(heading) * speed,
    angle: Math.random() * Math.PI * 2,
    spin,                                              // radians per second
    radius: Math.max(...atoms.map(at => Math.hypot(at.lx, at.ly) + at.r)),
  };
}

// World positions of a body's atoms, optionally offset (used to draw wrapped copies)
function bodyAtoms(b, dx = 0, dy = 0) {
  const ca = Math.cos(b.angle), sa = Math.sin(b.angle);
  return b.atoms.map((at, i) => ({
    x: b.x + at.lx * ca - at.ly * sa + dx,
    y: b.y + at.lx * sa + at.ly * ca + dy,
    z: 0, el: at.el, i,
  }));
}

function pickSpecies() {
  const total = SPECIES.reduce((a, sp) => a + sp.weight, 0);
  let r = Math.random() * total;
  for (const sp of SPECIES) { r -= sp.weight; if (r <= 0) return sp; }
  return SPECIES[SPECIES.length - 1];
}

// Launch speed in px/s, from the speed slider (0.2–8.0 on the dial)
function launchSpeed() {
  return parseFloat(document.getElementById('neutronSpeed').value) * 45;
}

function spawnWorld(n = molCount) {
  syncWorldBox();
  world.bodies = [];
  world.time = 0;

  for (let i = 0; i < n; i++) {
    const sp = pickSpecies();
    let placed = null;
    // Try for a spot clear of everything already down; after enough tries take
    // what we can get rather than loop forever in a crowded world.
    for (let attempt = 0; attempt < 400; attempt++) {
      const b = makeBody(sp.els,
        Math.random() * world.w,
        Math.random() * world.h,
        Math.random() * Math.PI * 2,
        launchSpeed() * (0.75 + Math.random() * 0.5),
        (Math.random() - 0.5) * 2.4);
      const clear = world.bodies.every(o => {
        const [dx, dy] = wrapDelta(o.x - b.x, o.y - b.y);
        return Math.hypot(dx, dy) > (o.radius + b.radius) * 1.35;
      });
      placed = b;
      if (clear) break;
    }
    world.bodies.push(placed);
  }
  lastDialSpeed = launchSpeed();
  resetEnergyTrace();
  updateParticleCounters();
}

// Shortest offset between two points in a wrap-around box ("minimum image")
function wrapDelta(dx, dy) {
  const W = world.w, H = world.h;
  if (dx >  W / 2) dx -= W; else if (dx < -W / 2) dx += W;
  if (dy >  H / 2) dy -= H; else if (dy < -H / 2) dy += H;
  return [dx, dy];
}

// ─── Physics ──────────────────────────────────────────────────────────────────
const RESTITUTION = 1.0;   // 1 = perfectly elastic: total kinetic energy is conserved

function stepWorld(dt) {
  // Move, spin, wrap
  for (const b of world.bodies) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.angle += b.spin * dt;
    b.x = ((b.x % world.w) + world.w) % world.w;
    b.y = ((b.y % world.h) + world.h) % world.h;
  }
  world.time += dt;

  // Collisions, atom against atom
  for (let i = 0; i < world.bodies.length; i++) {
    for (let j = i + 1; j < world.bodies.length; j++) {
      collidePair(world.bodies[i], world.bodies[j]);
    }
  }
}

// Velocity of a point on a rigid body, including its spin.
// In 2D the cross product ω × r is (-ω·ry, ω·rx).
function pointVel(b, rx, ry) {
  return [b.vx - b.spin * ry, b.vy + b.spin * rx];
}

function collidePair(A, B) {
  const [cdx, cdy] = wrapDelta(B.x - A.x, B.y - A.y);
  if (Math.hypot(cdx, cdy) > A.radius + B.radius) return;   // broad phase

  const ca = Math.cos(A.angle), sa = Math.sin(A.angle);
  const cb = Math.cos(B.angle), sb = Math.sin(B.angle);

  for (const pa of A.atoms) {
    // Atom offsets from each body's centre, in world axes
    const rax = pa.lx * ca - pa.ly * sa, ray = pa.lx * sa + pa.ly * ca;
    for (const pb of B.atoms) {
      const rbx = pb.lx * cb - pb.ly * sb, rby = pb.lx * sb + pb.ly * cb;

      // Vector from atom a to atom b, across the wrap
      const dx = cdx + rbx - rax, dy = cdy + rby - ray;
      const dist = Math.hypot(dx, dy);
      const minDist = pa.r + pb.r;
      if (dist >= minDist || dist === 0) continue;

      const nx = dx / dist, ny = dy / dist;   // contact normal, A → B

      const [vax, vay] = pointVel(A, rax, ray);
      const [vbx, vby] = pointVel(B, rbx, rby);
      const vn = (vbx - vax) * nx + (vby - vay) * ny;
      if (vn > 0) continue;                   // already separating

      // Rigid-body impulse: the rotational terms are what make a glancing hit
      // set the molecule spinning instead of just shoving it sideways.
      const rnA = rax * ny - ray * nx;
      const rnB = rbx * ny - rby * nx;
      const invMassSum = 1 / A.mass + 1 / B.mass
                       + rnA * rnA / A.inertia + rnB * rnB / B.inertia;
      const jImp = -(1 + RESTITUTION) * vn / invMassSum;

      A.vx -= jImp * nx / A.mass;  A.vy -= jImp * ny / A.mass;
      B.vx += jImp * nx / B.mass;  B.vy += jImp * ny / B.mass;
      A.spin -= rnA * jImp / A.inertia;
      B.spin += rnB * jImp / B.inertia;

      // Push the pair apart so they do not stay interlocked and re-collide
      const overlap = minDist - dist;
      const push = overlap / (1 / A.mass + 1 / B.mass) * 0.8;
      A.x -= push * nx / A.mass;  A.y -= push * ny / A.mass;
      B.x += push * nx / B.mass;  B.y += push * ny / B.mass;
      return;   // one contact per pair per frame keeps the response stable
    }
  }
}

function totalKineticEnergy() {
  return world.bodies.reduce((a, b) =>
    a + 0.5 * b.mass * (b.vx * b.vx + b.vy * b.vy)
      + 0.5 * b.inertia * b.spin * b.spin, 0);
}

// ─── Formula readout ──────────────────────────────────────────────────────────
// ─── Formula readout ──────────────────────────────────────────────────────────
const SUBS = '\u2080\u2081\u2082\u2083\u2084\u2085\u2086\u2087\u2088\u2089';
const sub = (n) => String(n).split('').map(d => SUBS[+d]).join('');

// ['H','H'] -> 'H₂';  ['H','O','H'] -> 'H₂O'.  Carbon first, then hydrogen, then
// the rest alphabetically — the usual Hill ordering for a formula.
function formulaOf(els) {
  const count = {};
  for (const e of els) count[e] = (count[e] || 0) + 1;
  const rank = (e) => e === 'C' ? 0 : e === 'H' ? 1 : 2;
  return Object.keys(count)
    .sort((a, b) => rank(a) - rank(b) || a.localeCompare(b))
    .map(e => e + (count[e] > 1 ? sub(count[e]) : ''))
    .join('');
}

// Shows what is in the world: the distinct species and how many of each.
function updateParticleCounters() {
  const f1   = document.getElementById('p1Formula');
  const f2   = document.getElementById('p2Formula');
  const l1   = document.getElementById('p1Label');
  const l2   = document.getElementById('p2Label');
  const p2El = document.getElementById('p2Counter');
  if (!f1) return;

  const tally = new Map();
  for (const b of world.bodies) {
    const f = formulaOf(b.els);
    tally.set(f, (tally.get(f) || 0) + 1);
  }
  const rows = [...tally.entries()];
  const put = (lab, val, [formula, n] = []) => {
    if (!formula) return false;
    lab.textContent = '×' + n + '\u00a0';
    val.textContent = formula;
    return true;
  };
  put(l1, f1, rows[0]);
  p2El.style.visibility = put(l2, f2, rows[1]) ? '' : 'hidden';
}

// ─── Speed lines (neutron speed indicator) ────────────────────────────────────
function drawSpeedLines() {
  const canvas = document.getElementById('speedLinesCanvas');
  if (!canvas) return;
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const slider = document.getElementById('neutronSpeed');
  const min = parseFloat(slider.min), max = parseFloat(slider.max);
  const t   = (parseFloat(slider.value) - min) / (max - min);  // 0..1

  c.clearRect(0, 0, w, h);

  // 3 right-aligned horizontal lines; lengths scale with slider
  const maxLen  = w - 2;
  const scales  = [0.65, 1.0, 0.80];
  const ys      = [h * 0.25, h * 0.5, h * 0.75];

  scales.forEach((scale, i) => {
    const tFloor = 0.18 + 0.82 * t;  // minimum ~18% even at slider min
    const len = tFloor * maxLen * scale;
    const x = w - len;
    const y = Math.round(ys[i]);

    // outer glow
    c.save();
    c.strokeStyle = 'rgba(180,180,210,0.25)';
    c.lineWidth = 4;
    c.beginPath(); c.moveTo(x, y); c.lineTo(w, y); c.stroke();

    // core
    c.strokeStyle = 'rgba(210,210,230,0.85)';
    c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(x, y); c.lineTo(w, y); c.stroke();
    c.restore();
  });
}

// ─── Projectile icon (beside the speed slider) ───────────────────────────────
const neutronIconJitter = { x: 0, y: 0 };

function drawNeutronIcon() {
  drawMoleculeIcon(document.getElementById('neutronIconCanvas'),
                   SPECIES[0].els, neutronIconJitter, 3);
}

function neutronIconLoop() {
  neutronIconJitter.x = (neutronIconJitter.x + (Math.random() - 0.5) * 0.7) * 0.78;
  neutronIconJitter.y = (neutronIconJitter.y + (Math.random() - 0.5) * 0.7) * 0.78;
  drawNeutronIcon();
  requestAnimationFrame(neutronIconLoop);
}
neutronIconLoop();

// ─── Molecule icons (NEW button, projectile, Particles mode button) ──────────
// Same hollow-shell look as drawAtom, at icon scale and independent of the
// quality setting (these canvases are tiny and redraw at ~15 fps).
function drawAtomIcon(c, px, py, el, R) {
  const e = ELEMENTS[el];
  const r = R * e.rScale;
  const g = c.createRadialGradient(px, py, 0, px, py, r);
  g.addColorStop(0.00, rgba(e.rgb, 0.06));
  g.addColorStop(0.55, rgba(e.rgb, 0.11));
  g.addColorStop(0.82, rgba(e.rgb, 0.27));
  g.addColorStop(0.96, rgba(e.rgb, 0.54));
  g.addColorStop(1.00, rgba(e.rgb, 0.34));
  c.fillStyle = g;
  c.beginPath(); c.arc(px, py, r, 0, Math.PI * 2); c.fill();
  c.strokeStyle = rgba(e.rgb, 0.95);
  c.lineWidth   = Math.max(1, r * 0.13);
  c.beginPath(); c.arc(px, py, r * 0.96, 0, Math.PI * 2); c.stroke();
}

// Atom offsets along the molecule axis in units of one H radius, re-centred,
// plus the half-extents needed to fit it to a canvas.
function moleculeIconLayout(els) {
  const offs = [0];
  for (let k = 1; k < els.length; k++) {
    offs.push(offs[k - 1] + (ELEMENTS[els[k - 1]].rScale + ELEMENTS[els[k]].rScale) * BOND_OVERLAP);
  }
  const mid = (offs[0] + offs[offs.length - 1]) / 2;
  const rel = offs.map(o => o - mid);
  return {
    rel,
    halfW: Math.max(...els.map((e, k) => Math.abs(rel[k]) + ELEMENTS[e].rScale)),
    halfH: Math.max(...els.map(e => ELEMENTS[e].rScale)),
  };
}

// Draws `els` as a molecule centred in `canvas`, scaled to fit. `jitter` is an
// optional shared {x, y} wobble so the icon looks alive.
function drawMoleculeIcon(canvas, els, jitter = null, pad = 3) {
  if (!canvas) return;
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  c.clearRect(0, 0, w, h);
  const { rel, halfW, halfH } = moleculeIconLayout(els);
  const R  = Math.min((w / 2 - pad) / halfW, (h / 2 - pad) / halfH);
  const cx = w / 2 + (jitter ? jitter.x : 0);
  const cy = h / 2 + (jitter ? jitter.y : 0);
  // Back-to-front is irrelevant for a flat row, but draw left-to-right for stable overlap
  els.forEach((el, k) => drawAtomIcon(c, cx + rel[k] * R, cy, el, R));
}

function drawOutlineIcon() {
  const ic = document.getElementById('outlineModeIcon');
  if (!ic) return;
  const c = ic.getContext('2d');
  const w = ic.width, h = ic.height;
  const cx = w / 2, cy = h / 2;
  const sR = Math.min(w, h) * 0.36;
  const R  = 2.5;
  const N  = Math.max(5, Math.round(2 * Math.PI * sR / (R * 1.5)));
  const centers = Array.from({ length: N }, (_, k) => {
    const a = k * 2 * Math.PI / N;
    return { x: cx + sR * Math.cos(a), y: cy + sR * Math.sin(a) };
  });
  // outerIntersection equivalent for the icon ctx
  function iconOuterIntersect(c1, c2) {
    const dx = c2.x - c1.x, dy = c2.y - c1.y;
    const d  = Math.sqrt(dx * dx + dy * dy);
    const h2 = Math.sqrt(Math.max(0, R * R - (d / 2) ** 2));
    const mx = (c1.x + c2.x) / 2, my = (c1.y + c2.y) / 2;
    const px = -dy / d * h2, py = dx / d * h2;
    const p1 = { x: mx + px, y: my + py }, p2 = { x: mx - px, y: my - py };
    const d1 = (p1.x - cx)**2 + (p1.y - cy)**2;
    const d2 = (p2.x - cx)**2 + (p2.y - cy)**2;
    return d1 > d2 ? p1 : p2;
  }
  const arcs = centers.map((pt, k) => {
    const prev = centers[(k - 1 + N) % N], next = centers[(k + 1) % N];
    const sp = iconOuterIntersect(pt, prev);
    const ep = iconOuterIntersect(pt, next);
    return { cx: pt.x, cy: pt.y, startAngle: Math.atan2(sp.y - pt.y, sp.x - pt.x), endAngle: Math.atan2(ep.y - pt.y, ep.x - pt.x) };
  });
  c.clearRect(0, 0, w, h);
  c.save();
  c.shadowColor = 'rgba(80,160,255,0.9)'; c.shadowBlur = 4;
  c.strokeStyle = 'rgba(160,215,255,1)'; c.lineWidth = 1;
  c.beginPath();
  c.moveTo(arcs[0].cx + R * Math.cos(arcs[0].startAngle), arcs[0].cy + R * Math.sin(arcs[0].startAngle));
  for (const arc of arcs) c.arc(arc.cx, arc.cy, R, arc.startAngle, arc.endAngle, false);
  c.closePath(); c.stroke(); c.restore();
}

let _iconLast = -67;
const newBtnIconJitter = { x: 0, y: 0 };
const miniIconJitter   = { x: 0, y: 0 };
function wobbleIcon(j, step) {
  j.x = (j.x + (Math.random() - 0.5) * step) * 0.78;
  j.y = (j.y + (Math.random() - 0.5) * step) * 0.78;
}

function nucleusIconLoop(now) {
  if (now - _iconLast >= 67) {   // ~15 fps
    _iconLast = now;
    wobbleIcon(newBtnIconJitter, 0.7);
    wobbleIcon(miniIconJitter,   0.4);
    drawMoleculeIcon(document.getElementById('newBtnNucleus'), SPECIES[0].els, newBtnIconJitter, 4);
    drawMoleculeIcon(document.getElementById('particlesModeIcon'), SPECIES[0].els, miniIconJitter, 1);
  }
  requestAnimationFrame(nucleusIconLoop);
}
nucleusIconLoop(0);
drawOutlineIcon();

// ─── Renderer ─────────────────────────────────────────────────────────────────
// Each body is drawn in up to four places: its own position plus a copy shifted
// by a full world width/height whenever it overhangs an edge. That is what makes
// a molecule look continuous as it wraps rather than popping across the screen.
function wrapOffsets(b) {
  const offs = [[0, 0]];
  const nearL = b.x - b.radius < 0,        nearR = b.x + b.radius > world.w;
  const nearT = b.y - b.radius < 0,        nearB = b.y + b.radius > world.h;
  if (nearL) offs.push([ world.w, 0]);
  if (nearR) offs.push([-world.w, 0]);
  if (nearT) offs.push([0,  world.h]);
  if (nearB) offs.push([0, -world.h]);
  if (nearL && nearT) offs.push([ world.w,  world.h]);
  if (nearL && nearB) offs.push([ world.w, -world.h]);
  if (nearR && nearT) offs.push([-world.w,  world.h]);
  if (nearR && nearB) offs.push([-world.w, -world.h]);
  return offs;
}

function drawWorld() {
  ctx.fillStyle = document.body.classList.contains('screenshot-mode') ? getBgColor() : '#05040f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  // World (0,0) sits at the top-left of the visible band; zoom is about its centre
  ctx.translate(0, world.top);
  ctx.translate(world.w / 2, world.h / 2);
  ctx.scale(viewZoom, viewZoom);
  ctx.translate(-world.w / 2, -world.h / 2);

  const showElec = document.getElementById('showElectric').checked;
  if (showElec) {
    const all = world.bodies.flatMap(b => bodyAtoms(b));
    drawElectricHeatmap(all, 0.5, 1.0, null);
  }

  for (const b of world.bodies) {
    for (const [dx, dy] of wrapOffsets(b)) {
      const atoms = bodyAtoms(b, dx, dy);
      if (showParticles) drawParticles(atoms);
      else               drawMoleculeOutline(atoms);
    }
  }

  ctx.restore();
  drawEnergyGraph();
}

// ─── Main loop ────────────────────────────────────────────────────────────────
let worldRAF  = null;
let lastFrame = 0;

function timeScale() {
  return parseFloat(document.getElementById('playbackSpeed').value);
}

function worldLoop(now) {
  worldRAF = requestAnimationFrame(worldLoop);
  if (!lastFrame) lastFrame = now;
  // Clamp dt so a backgrounded tab does not resume with one enormous step that
  // tunnels molecules straight through each other.
  const dt = Math.min(0.05, (now - lastFrame) / 1000) * timeScale();
  lastFrame = now;
  if (running) {
    // Sub-step so fast molecules cannot pass through one another in one frame
    const steps = Math.max(1, Math.ceil(dt / 0.004));
    for (let k = 0; k < steps; k++) stepWorld(dt / steps);
    sampleEnergy();
  }
  drawWorld();
}

function startWorldLoop() {
  if (worldRAF === null) { lastFrame = 0; worldRAF = requestAnimationFrame(worldLoop); }
}

function setRunning(on) {
  running = on;
  const btn = document.getElementById('goBtn');
  btn.innerHTML = on ? '&#10073;&#10073; PAUSE' : '&#9654; GO';
  btn.classList.toggle('running', on);
  if (on) lastFrame = 0;
  logAction(on ? 'Started' : 'Paused');
}

// ─── Energy trace ─────────────────────────────────────────────────────────────
// A scrolling record of the world's total kinetic energy. With perfectly elastic
// collisions the line should stay flat — a visible step means energy leaked.
const EG_WINDOW  = 12;     // seconds shown across the graph
const EG_SAMPLES = 480;
let egTrace = [];          // [{ t, ke }]
let egRef   = 1;           // energy at spawn, the 100% line

function resetEnergyTrace() {
  egTrace = [];
  egRef = Math.max(1e-6, totalKineticEnergy());
}

function sampleEnergy() {
  egTrace.push({ t: world.time, ke: totalKineticEnergy() });
  while (egTrace.length > EG_SAMPLES) egTrace.shift();
  const cutoff = world.time - EG_WINDOW;
  while (egTrace.length && egTrace[0].t < cutoff) egTrace.shift();
}

function drawEnergyGraph() {
  const W = egCanvas.width, H = egCanvas.height;
  const PAD = 8, gH = H - PAD * 2;
  egCtx.clearRect(0, 0, W, H);

  const LIGHT = document.body.classList.contains('screenshot-mode');
  const gridCol = LIGHT ? 'rgba(0,0,0,0.10)' : 'rgba(255,255,255,0.06)';
  const axisCol = LIGHT ? 'rgba(0,0,0,0.55)' : 'rgba(0,200,255,0.35)';
  const keCol   = LIGHT ? '#000'             : '#ff3a6e';
  const keGlow  = LIGHT ? 'rgba(0,0,0,0)'    : 'rgba(255,45,100,0.9)';

  egCtx.strokeStyle = gridCol;
  egCtx.lineWidth = 1;
  for (let i = 1; i <= 3; i++) {
    const y = PAD + gH * (1 - i / 4);
    egCtx.beginPath(); egCtx.moveTo(0, y); egCtx.lineTo(W, y); egCtx.stroke();
  }

  egCtx.save();
  egCtx.shadowBlur = LIGHT ? 0 : 6;
  egCtx.shadowColor = LIGHT ? 'rgba(0,0,0,0)' : 'rgba(0,200,255,0.5)';
  egCtx.strokeStyle = axisCol;
  egCtx.lineWidth = 1;
  egCtx.beginPath(); egCtx.moveTo(0, H - PAD); egCtx.lineTo(W, H - PAD); egCtx.stroke();
  egCtx.restore();

  if (egTrace.length > 1) {
    // Full scale is twice the starting energy, so a flat run sits mid-graph
    const t1 = world.time, t0 = t1 - EG_WINDOW;
    const px = (t) => ((t - t0) / EG_WINDOW) * (W - 1);
    const py = (ke) => PAD + gH * (1 - Math.max(0, Math.min(1, ke / (egRef * 2))));
    const stroke = (lw, blur, alpha) => {
      egCtx.save();
      egCtx.globalAlpha = alpha;
      egCtx.shadowBlur = LIGHT ? 0 : blur;
      egCtx.shadowColor = keGlow;
      egCtx.strokeStyle = keCol;
      egCtx.lineWidth = lw;
      egCtx.beginPath();
      egTrace.forEach((pt, k) => {
        const x = px(pt.t), y = py(pt.ke);
        if (k === 0) egCtx.moveTo(x, y); else egCtx.lineTo(x, y);
      });
      egCtx.stroke();
      egCtx.restore();
    };
    stroke(8, 28, 0.25);
    stroke(3, 10, 0.55);
    stroke(1.5, 0, 1.0);
  }
}

function updateEnergyPct() {
  const el = document.getElementById('energyPctKE');
  if (!el) return;
  const ke = totalKineticEnergy();
  el.textContent = Math.round(ke / egRef * 100) + '%';
}

// ─── Controls ─────────────────────────────────────────────────────────────────
document.getElementById('goBtn').addEventListener('click', () => {
  setRunning(!running);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  setRunning(false);
  spawnWorld();
  logAction('Reset world');
});

document.getElementById('newBtn').addEventListener('click', () => {
  spawnWorld();
  logAction('Respawned molecules');
});

let lastDialSpeed = 0;
document.getElementById('neutronSpeed').addEventListener('input', function () {
  drawSpeedLines();
  // Scale the whole world by the same factor rather than flattening every
  // molecule to one speed — collisions have spread them out, and that spread
  // is the interesting part.
  const target = launchSpeed();
  if (lastDialSpeed > 0) {
    const k = target / lastDialSpeed;
    for (const b of world.bodies) { b.vx *= k; b.vy *= k; b.spin *= k; }
  }
  lastDialSpeed = target;
  resetEnergyTrace();
});

document.getElementById('zoomSlider').addEventListener('input', function () {
  viewZoom = zoomFromSlider(parseFloat(this.value));
  heatmapDirty = true;
});

document.getElementById('showElectric').addEventListener('change', function () {
  heatmapDirty = true;
  logAction('Electric field ' + (this.checked ? 'on' : 'off'));
});

document.getElementById('qualitySelect').addEventListener('change', function () {
  _applyQuality(this.value);
  heatmapDirty = true;
});

function setParticleWheelActive(targetBtn) {
  document.querySelectorAll('.awheel-item[data-pmode]').forEach(b =>
    b.classList.toggle('active', b === targetBtn));
}
document.querySelectorAll('.awheel-item[data-pmode]').forEach(btn => {
  btn.addEventListener('click', () => {
    showParticles = btn.dataset.pmode === 'particles';
    setParticleWheelActive(btn);
    logAction('View: ' + btn.dataset.pmode);
  });
});

// Playback-speed slider: blue tick at 1.0, snaps when released nearby
const PBSPEED_DEFAULT = 1.0;
const PBSPEED_SNAP = 0.10;
(function _posPbSpeedTick() {
  const sl = document.getElementById('playbackSpeed');
  const tick = document.getElementById('pbSpeedDefaultTick');
  if (!sl || !tick) return;
  const min = parseFloat(sl.min), max = parseFloat(sl.max);
  const frac = (PBSPEED_DEFAULT - min) / (max - min);
  tick.style.left = `calc(${frac * 100}% + ${(0.5 - frac) * 14}px)`;
})();
document.getElementById('playbackSpeed').addEventListener('change', function () {
  if (Math.abs(parseFloat(this.value) - PBSPEED_DEFAULT) < PBSPEED_SNAP) {
    this.value = PBSPEED_DEFAULT;
  }
});

// Energy graph show/hide. The key, the graph and the percentage appear together,
// each via its own `.visible` class (they are display:none by default).
const GRAPH_PARTS = ['scrubGraphKey', 'energyGraphBox', 'scrubPercents'];
let graphShown = true;

function setGraphShown(on) {
  graphShown = on;
  for (const id of GRAPH_PARTS) document.getElementById(id).classList.toggle('visible', on);
  document.getElementById('energyGraphToggle').innerHTML =
    (on ? 'HIDE' : 'SHOW') + ' LINE<br>GRAPH';
  // The canvas has no width while hidden, so re-measure once it is back
  if (on) resize();
}
function updateGraphBtn() { setGraphShown(graphShown); }

document.getElementById('energyGraphToggle').addEventListener('click', () => {
  setGraphShown(!graphShown);
});

// ─── Dev panel — type "dev" anywhere to open ─────────────────────────────────
(function devPanel() {
  const panel = document.createElement('div');
  panel.id = 'devPanel';
  panel.style.cssText = 'position:fixed;right:14px;bottom:178px;z-index:9000;display:none;' +
    'background:rgba(8,6,24,0.96);border:1px solid rgba(255,45,120,0.35);border-radius:10px;' +
    'padding:10px 12px;font-family:Lexend,sans-serif;font-size:11px;color:rgba(255,255,255,0.8);' +
    'min-width:190px;box-shadow:0 6px 30px rgba(0,0,0,0.7);';
  panel.innerHTML =
    '<div style="font-size:9px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.5;' +
         'margin-bottom:8px;">Dev</div>' +
    '<label style="display:block;margin-bottom:4px;">Molecules: ' +
      '<span id="devCountVal" style="color:#ff3a8a;font-weight:700">' + MOL_COUNT_DEFAULT + '</span></label>' +
    '<input type="range" id="devCount" min="1" max="40" step="1" value="' + MOL_COUNT_DEFAULT +
      '" style="width:100%">' +
    '<div style="margin-top:8px;opacity:0.45;font-size:10px;">' +
      'Restitution ' + RESTITUTION.toFixed(2) + ' \u2014 collisions are elastic</div>';
  document.body.appendChild(panel);

  const slider = panel.querySelector('#devCount');
  const label  = panel.querySelector('#devCountVal');
  slider.addEventListener('input', () => {
    molCount = parseInt(slider.value, 10);
    label.textContent = molCount;
    spawnWorld();
  });

  // Keep the energy readout live while the panel is open
  setInterval(() => { if (panel.style.display !== 'none') updateEnergyPct(); }, 250);

  let buf = '';
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    buf = (buf + e.key.toLowerCase()).slice(-3);
    if (buf === 'dev') {
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      logAction('Toggled dev panel');
    }
  });
})();

// ─── Themes ───────────────────────────────────────────────────────────────────
const THEMES = {
  A: {
    accent1:'#ff2d78', accent1dim:'rgba(255,45,120,0.25)', accent1glow:'rgba(255,45,120,0.55)',
    accent2:'#1a6eff', accent2dim:'rgba(26,110,255,0.18)',  accent2glow:'rgba(26,110,255,0.45)',
    uibg:'rgba(8,6,24,0.38)', uiborder:'rgba(255,255,255,0.07)',
    textdim:'rgba(220,215,255,0.55)', textbright:'rgba(240,235,255,0.92)',
    bg:'#05040f',
  },
  B: {
    accent1:'#ff2d78', accent1dim:'rgba(255,45,120,0.22)', accent1glow:'rgba(255,45,120,0.5)',
    accent2:'#bd00ff', accent2dim:'rgba(189,0,255,0.18)',  accent2glow:'rgba(189,0,255,0.42)',
    uibg:'rgba(8,4,22,0.42)', uiborder:'rgba(189,0,255,0.14)',
    textdim:'rgba(230,200,255,0.52)', textbright:'rgba(248,232,255,0.92)',
    bg:'#05030f',
  },
  C: {
    accent1:'#ff2d78', accent1dim:'rgba(255,45,120,0.22)', accent1glow:'rgba(255,45,120,0.5)',
    accent2:'#00f5e0', accent2dim:'rgba(0,245,224,0.15)',  accent2glow:'rgba(0,245,224,0.4)',
    uibg:'rgba(6,4,20,0.40)', uiborder:'rgba(255,45,120,0.12)',
    textdim:'rgba(220,210,255,0.52)', textbright:'rgba(245,235,255,0.92)',
    bg:'#04030e',
  },
};

function applyTheme(key) {
  const t = THEMES[key];
  const r = document.documentElement.style;
  r.setProperty('--accent1',      t.accent1);
  r.setProperty('--accent1-dim',  t.accent1dim);
  r.setProperty('--accent1-glow', t.accent1glow);
  r.setProperty('--accent2',      t.accent2);
  r.setProperty('--accent2-dim',  t.accent2dim);
  r.setProperty('--accent2-glow', t.accent2glow);
  r.setProperty('--ui-bg',        t.uibg);
  r.setProperty('--ui-border',    t.uiborder);
  r.setProperty('--text-dim',     t.textdim);
  r.setProperty('--text-bright',  t.textbright);
  document.body.style.background = t.bg;
  document.body.classList.remove('screenshot-mode');
  document.getElementById('themeLight').classList.remove('active');
  document.querySelectorAll('.theme-btn:not(#themeLight):not([data-theme="L"])').forEach(b => b.classList.remove('active'));
  document.getElementById('theme'+key).classList.add('active');
  heatmapDirty = true;   // the main loop repaints the scene every frame
}
document.getElementById('themeA').addEventListener('click', () => applyTheme('A'));
document.getElementById('themeB').addEventListener('click', () => applyTheme('B'));
document.getElementById('themeC').addEventListener('click', () => applyTheme('C'));
function getBgColor() { return document.getElementById('bgColorPicker').value; }
document.getElementById('bgColorPicker').addEventListener('input', function() {
  document.documentElement.style.setProperty('--bg-color', this.value);
  heatmapDirty = true;
});
document.getElementById('themeLight').addEventListener('click', () => {
  const on = document.body.classList.toggle('screenshot-mode');
  document.getElementById('themeLight').classList.toggle('active', on);
  heatmapDirty = true;
});
applyTheme('A');

setParticleWheelActive(document.querySelector('.awheel-item[data-pmode="particles"]'));

// ── Bug report button ─────────────────────────────────────────────────────
function getBugState() {
  return {
    sim:        'reactions',
    running,
    molCount,
    species:    world.bodies.map(b => formulaOf(b.els)),
    worldTime:  +world.time.toFixed(2),
    keFraction: +(totalKineticEnergy() / egRef).toFixed(4),
    actionLog:  actionLog.slice(),
  };
}
document.getElementById('bugReportBtn').addEventListener('click', e => {
  e.preventDefault();
  const state = encodeURIComponent(JSON.stringify(getBugState()));
  const url   = `https://ghostoutfit.github.io/protons/dev/bug-report.html?sim=fission&sourceUrl=${encodeURIComponent(location.href)}&state=${state}`;
  document.getElementById('bugModalFrame').src = url;
  document.getElementById('bugModal').style.display = 'flex';
});
function closeBugModal() {
  document.getElementById('bugModal').style.display = 'none';
  document.getElementById('bugModalFrame').src = 'about:blank';
}
document.getElementById('bugModal').addEventListener('click', e => {
  if (e.target === document.getElementById('bugModal')) closeBugModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('bugModal').style.display === 'flex') closeBugModal();
});
